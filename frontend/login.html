<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraceKey 2.0 — Secure Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #1e0b36, #0B1120 40%, #050810 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    /* Background animated glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: float 10s infinite ease-in-out alternate;
    }
    .orb-1 { width: 300px; height: 300px; background: rgba(6, 182, 212, 0.4); top: 10%; left: 20%; }
    .orb-2 { width: 400px; height: 400px; background: rgba(139, 92, 246, 0.4); bottom: 10%; right: 15%; animation-duration: 12s; }
    
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-50px) scale(1.1); }
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 48px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.6s ease-out;
      margin: 20px;
      position: relative;
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; text-align: center; letter-spacing: -0.5px; }
    h1 span { color: #06B6D4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
    p.sub { color: #94A3B8; font-size: 15px; margin-bottom: 32px; text-align: center; }
    
    .form-group { margin-bottom: 20px; position: relative; }
    label { display: block; font-size: 13px; color: #CBD5E1; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%; padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6); 
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px; color: #fff; font-size: 15px;
      transition: all 0.3s ease;
    }
    input:focus { outline: none; border-color: #06B6D4; background: rgba(15, 23, 42, 0.9); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
    
    button {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #06B6D4, #3B82F6);
      border: none;
      border-radius: 10px; color: #fff;
      font-size: 16px; font-weight: 700;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    
    .loader {
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: none;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .err { color: #F87171; font-size: 14px; margin-top: 14px; text-align: center; font-weight: 500; min-height: 20px; }
    .success { color: #10B981; }
    .switch { text-align: center; margin-top: 24px; color: #94A3B8; font-size: 14px; }
    .switch a { color: #06B6D4; text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .switch a:hover { color: #fff; }

    /* Forms */
    #registerForm { display: none; }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="card">
  <!-- LOGIN -->
  <div id="loginForm" class="fade-in">
    <h1>Trace<span>Key</span> 2.0</h1>
    <p class="sub">Welcome back to the Intelligence Hub</p>
    
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="you@domain.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    
    <button id="loginBtn" onclick="login()">
      <span class="loader" id="loginLoader"></span>
      <span id="loginText">Authenticate</span>
    </button>
    <div class="err" id="loginErr"></div>
    <div class="switch">First time here? <a href="#" onclick="toggle()">Initialize Account</a></div>
  </div>

  <!-- REGISTER -->
  <div id="registerForm">
    <h1>Trace<span>Key</span> 2.0</h1>
    <p class="sub">Initialize your developer clearance</p>
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="John Doe">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="regEmail" placeholder="you@domain.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Minimum 6 characters">
    </div>
    
    <button id="regBtn" onclick="register()">
      <span class="loader" id="regLoader"></span>
      <span id="regText">Create Access Key</span>
    </button>
    <div class="err" id="regErr"></div>
    <div class="switch">Already cleared? <a href="#" onclick="toggle()">Authenticate</a></div>
  </div>
</div>

<script>
  const API = window.location.port === "5173"
    ? `${window.location.protocol}//${window.location.hostname}:5000/api`
    : `${window.location.origin}/api`;

  function getFingerprint() {
    return {
      browser: navigator.userAgent.match(/(firefox|msie|chrome|safari|trident)/i)?.[0] || "Unknown",
      os: navigator.platform,
      platform: navigator.vendor || "Unknown",
      screen: `${screen.width}x${screen.height}`,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      language: navigator.language,
      hash: btoa(`${navigator.userAgent}${screen.width}${navigator.language}`).slice(0, 16)
    };
  }

  function toggle() {
    const lf = document.getElementById("loginForm");
    const rf = document.getElementById("registerForm");
    
    if (lf.style.display !== "none") {
      lf.style.display = "none";
      rf.style.display = "block";
      rf.classList.add("fade-in");
    } else {
      rf.style.display = "none";
      lf.style.display = "block";
      lf.classList.add("fade-in");
    }
    
    document.getElementById("loginErr").textContent = "";
    document.getElementById("regErr").textContent = "";
  }

  async function login() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errEl = document.getElementById("loginErr");
    const btn = document.getElementById("loginBtn");
    const loader = document.getElementById("loginLoader");
    const text = document.getElementById("loginText");

    errEl.textContent = "";
    errEl.className = "err";

    if (!email || !password) {
      errEl.textContent = "Please fill in all fields.";
      return;
    }

    const fingerprint = getFingerprint();

    try {
      btn.disabled = true;
      loader.style.display = "block";
      text.textContent = "Authenticating...";
      
      const res = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, fingerprint })
      });
      const data = await res.json();
      
      if (data.token) {
        localStorage.setItem("tk_token", data.token);
        localStorage.setItem("tk_user", JSON.stringify(data.user));
        errEl.textContent = "Authentication successful! Redirecting...";
        errEl.className = "err success";
        setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
      } else {
        errEl.textContent = data.message || "Invalid credentials";
        btn.disabled = false;
        loader.style.display = "none";
        text.textContent = "Authenticate";
      }
    } catch (e) {
      errEl.textContent = "Server offline. Ensure backend is running.";
      btn.disabled = false;
      loader.style.display = "none";
      text.textContent = "Authenticate";
    }
  }

  async function register() {
    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;
    const errEl = document.getElementById("regErr");
    const btn = document.getElementById("regBtn");
    const loader = document.getElementById("regLoader");
    const text = document.getElementById("regText");

    errEl.textContent = "";

    if (!name || !email || !password) {
      errEl.textContent = "Please fill in all fields.";
      return;
    }

    try {
      btn.disabled = true;
      loader.style.display = "block";
      text.textContent = "Creating...";
      
      const res = await fetch(`${API}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });
      const data = await res.json();
      
      if (res.status === 201) {
        toggle();
        document.getElementById("loginEmail").value = email;
        const loginErr = document.getElementById("loginErr");
        loginErr.className = "err success";
        loginErr.textContent = "Clearance granted! Please authenticate.";
        document.getElementById("loginPassword").focus();
      } else {
        errEl.textContent = data.message || "Registration failed.";
        btn.disabled = false;
        loader.style.display = "none";
        text.textContent = "Create Access Key";
      }
    } catch (e) {
      errEl.textContent = "Server offline. Ensure backend is running.";
      btn.disabled = false;
      loader.style.display = "none";
      text.textContent = "Create Access Key";
    }
  }
</script>
</body>
</html>
